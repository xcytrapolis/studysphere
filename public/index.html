<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduView</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(700px, 90%);

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 8px;
        }

        p {
            color: #666;
        }

        form {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        input {
            flex: 1;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        button {
            padding: 14px 24px;

            border: 0;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>EduView</h1>

        <p>
            Enter the address of an
            authorized website.
        </p>

        <form id="proxyForm">

            <input
                id="url"
                type="text"
                placeholder="https://example.com"
                required
            >

            <button type="submit">
                Go
            </button>

        </form>

    </div>

    <script>

        const form =
            document.getElementById(
                "proxyForm"
            );

        const input =
            document.getElementById(
                "url"
            );

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                let value =
                    input.value.trim();

                if (
                    !value.startsWith(
                        "http://"
                    ) &&
                    !value.startsWith(
                        "https://"
                    )
                ) {
                    value =
                        "https://" +
                        value;
                }

                window.location.href =
                    "/proxy?url=" +
                    encodeURIComponent(
                        value
                    );
            }
        );

    </script>

</body>

</html>
